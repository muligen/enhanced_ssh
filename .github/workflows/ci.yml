name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # `npm test` builds the Windows Job Object supervisor (net9.0) first.
      - name: Set up .NET 9
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Install dependencies
        run: npm ci

      # Advisory only. The production dependency tree is the same on every
      # platform, so it is audited once, on Linux.
      - name: Audit production dependencies
        if: runner.os == 'Linux'
        continue-on-error: true
        run: npm audit --omit=dev

      - name: Type-check
        run: npm run typecheck

      # Full build (.NET supervisor + TypeScript), then every test, including
      # the tests that only run on Windows.
      - name: Test (full build)
        if: runner.os == 'Windows'
        run: npm test

      # No .NET here: TypeScript build only. Windows-only tests skip themselves.
      - name: Test (TypeScript only)
        if: runner.os == 'Linux'
        run: npm run test:ts
